<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final çalışma planı</title><link rel="stylesheet" href="style.css">
<script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><main id="login" class="shell"><section class="exam-schedule login-card">
<h1>Final çalışma planı</h1>
<form id="login-form">
<label class="exam-field">E-posta<input name="email" type="email" autocomplete="username" required></label>
<label class="exam-field">Şifre<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Giriş yap</button>
</form></section></main>
<div class="shell account-bar"><span id="notice" role="status"></span><button id="logout" type="button" hidden>Çıkış yap</button></div>
<div id="plan" hidden></div></body></html>
